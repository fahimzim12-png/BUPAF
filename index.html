<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Ledger League</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#F7F7F4;--bl:#253B80;--bt:#fff;--co:#F07B64;--li:#D5EF77;--w:#fff;--tx:#222631;--mu:#686d7c;--ln:#e2e2db;--ok:#dff3d3;--er:#fbd9d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171f;--bl:#9db0f2;--bt:#14171f;--w:#1d212c;--tx:#f1f1ec;--mu:#9aa0b2;--ln:#2b3040;--ok:#24422b;--er:#4d2a25}}
:root[data-theme=dark]{--bg:#14171f;--bl:#9db0f2;--bt:#14171f;--w:#1d212c;--tx:#f1f1ec;--mu:#9aa0b2;--ln:#2b3040;--ok:#24422b;--er:#4d2a25}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Manrope,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--co);outline-offset:2px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;max-width:1100px;margin:auto}nav b{font-weight:800;letter-spacing:-.02em;color:var(--bl)}nav a{margin-left:18px;color:var(--mu);text-decoration:none;font-weight:600}nav a:hover{color:var(--bl)}
main{max-width:1100px;margin:auto;padding:8px 24px 64px}h1{font-size:clamp(44px,9vw,92px);line-height:.95;letter-spacing:-.04em;font-weight:800;color:var(--bl);margin:24px 0 12px}h1 u{text-decoration:none;background:linear-gradient(transparent 62%,var(--li) 62%)}
h2{font-size:24px;letter-spacing:-.02em;margin:32px 0 12px}.mu{color:var(--mu)}
.btn{background:var(--bl);color:var(--bt);border:0;border-radius:999px;padding:12px 24px;font-weight:700;transition:transform .12s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn.s{background:transparent;color:var(--bl);border:1.5px solid var(--ln)}.btn.c{background:var(--co);color:#222631}.btn.l{background:var(--li);color:#222631}.btn:disabled{opacity:.45}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}input[type=text],input[type=password],input[type=search]{border:1.5px solid var(--ln);background:var(--w);border-radius:12px;padding:10px 14px;min-width:0}
.bar{display:flex;gap:28px;flex-wrap:wrap;border-bottom:1.5px solid var(--ln);padding-bottom:12px}.bar div{display:flex;flex-direction:column}.bar b{font-size:12px;color:var(--mu);font-weight:600}.bar span{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--bl);font-variant-numeric:tabular-nums}
.hint{color:var(--mu);margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}@media(max-width:760px){.g{grid-template-columns:1fr}.pool{order:-1}}
.sls{display:grid;gap:8px}.sl{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border:1.5px dashed var(--ln);background:var(--w);border-radius:14px;text-align:left;transition:background .2s,border-color .2s}.sl:hover{border-color:var(--bl)}.sl.dr{border-color:var(--bl);background:var(--li);color:#222631}
.sl.ok{background:var(--ok);border:1.5px solid #7cc58a;cursor:default}.sl.bad{background:var(--er);border-color:var(--co);animation:sh .35s}.nm{font-weight:700;flex:1}.ck{color:#2e8b45;font-style:normal;font-weight:800;animation:pop .3s}
.ph{width:48px;height:60px;border-radius:9px;object-fit:cover;background:var(--bg);flex:none;display:block}.ghost{opacity:.6}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}.pc{padding:0;border:2.5px solid transparent;border-radius:12px;background:none;transition:transform .15s,border-color .15s}.pc:hover{transform:translateY(-3px)}.pc.sel{border-color:var(--co);transform:scale(1.05)}.pc img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:9px;display:block}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}@keyframes pop{from{transform:scale(0)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cf{position:fixed;top:-20px;width:9px;height:14px;animation:fall 2.6s ease-in forwards;z-index:9;pointer-events:none}
.tab{display:flex;gap:6px;border-bottom:1.5px solid var(--ln);margin:12px 0 20px;flex-wrap:wrap}.tab button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--mu);border-bottom:3px solid transparent}.tab .on{color:var(--bl);border-color:var(--co)}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--ln)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rec{display:grid;grid-template-columns:48px 1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.rec input[type=text]{width:100%}
.st{display:flex;gap:32px;flex-wrap:wrap}.st b{font-size:32px;display:block;color:var(--bl);letter-spacing:-.03em}
.drop{border:2px dashed var(--ln);border-radius:16px;padding:32px;text-align:center;background:var(--w)}.drop.dr{border-color:var(--bl);background:var(--li);color:#222631}.pg{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--bl);transition:width .2s}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.rv>div{border:1.5px solid var(--ln);border-radius:14px;padding:12px;background:var(--w);display:grid;gap:8px}.rv img{width:100%;border-radius:8px}.rv .pi{width:90px;aspect-ratio:4/5;object-fit:cover}
.tg{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--li);color:#222631;display:inline-block}.tg.w{background:var(--er)}
.ed{display:grid;grid-template-columns:1fr 280px;gap:20px;border:1.5px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:20px;background:var(--w)}@media(max-width:760px){.ed{grid-template-columns:1fr}}.ed canvas{max-width:100%}.ed label{display:grid;font-size:13px;color:var(--mu)}.edp{display:grid;gap:8px;align-content:start}
.pod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;margin:24px 0}.pod>div{text-align:center;background:var(--w);border-radius:14px 14px 0 0;padding:14px 6px;border:1.5px solid var(--ln);border-bottom:0}.pod .p1{background:var(--li);color:#222631;padding-top:44px}.pod .p2{padding-top:26px}.pod b{display:block;font-size:26px;color:var(--bl)}.p1 b{color:#222631}
.me{background:var(--li);color:#222631}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:10}
.big{font-size:clamp(56px,12vw,110px);font-weight:800;letter-spacing:-.04em;color:var(--bl);line-height:1}.ach{display:inline-block;margin:0 8px 8px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><nav><b>THE LEDGER LEAGUE</b><div><a href="#/">Play</a><a href="#/board">Leaderboard</a><a href="#/admin">Admin</a></div></nav><main id="m"></main>
<script>
// ===== CONFIG (edit here) =====
const N=10,CFG={PTS:[100,60,30,10],COMBO:3,COMBO_B:30,PERF:300,SPEED:{max:100,full:60,zero:240},QUICK:90,BATCH:5,MAXFILE:15e6,
RANKS:[[0,'Stranger'],[400,'Acquaintance'],[800,'Forum Insider'],[1100,'Recruit Master'],[1350,'Accounting Forum Legend']]}; // max possible = 1000+90+300+100 = 1490
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
let tt;const toast=t=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);clearTimeout(tt);tt=setTimeout(()=>e.remove(),2200)};
// ===== STORAGE LAYER (IndexedDB, local to this browser). Swap this object for Supabase calls to go cloud. =====
const DB=(()=>{let p;const o=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('ledger',1);r.onupgradeneeded=()=>['recruits','posters','staged','results','meta'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(s,m,f)=>{const d=await o();return new Promise((res,rej)=>{const t=d.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
return{all:s=>tx(s,'readonly',o=>o.getAll()),get:(s,k)=>tx(s,'readonly',o=>o.get(k)),put:(s,v)=>tx(s,'readwrite',o=>o.put(v)),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k))}})();
// ===== SCORING: pure function of the attempt log =====
function calc(log,secs,timer){const att={};let st=0,mx=0,base=0,combo=0,first=0,wrong=0,m=0;
for(const e of log){att[e.r]=(att[e.r]||0)+1;if(e.ok){const a=att[e.r];base+=CFG.PTS[a-1]??0;if(a==1)first++;m++;st++;mx=Math.max(mx,st);if(st%CFG.COMBO==0)combo+=CFG.COMBO_B}else{wrong++;st=0}}
const done=m==N,perfect=done&&first==N&&wrong==0?CFG.PERF:0,S=CFG.SPEED,speed=done&&timer?Math.round(S.max*clamp((S.zero-secs)/(S.zero-S.full),0,1)):0;
return{base,combo,perfect,speed,total:base+combo+perfect+speed,first,wrong,mx,m,st,done}}
const rankOf=s=>CFG.RANKS.filter(r=>s>=r[0]).pop()[1];
// ===== STATE =====
const S={timer:true,sound:true,name:'',pid:null};let G=null,A={tab:'rec',auth:false,q:'',Q:[],seen:new Set(),run:false,sel:new Set(),E:null,tpl:null,staged:[]},iv;
const beep=(f,d=.12)=>{if(!S.sound)return;try{const c=new (window.AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}};
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function init(){const p=await DB.get('meta','player');if(p){S.name=p.name||'';S.pid=p.pid}
A.tpl=(await DB.get('meta','template'))||{id:'template',p:{x:.1,y:.1,w:.8},n:{x:.1,y:.75,w:.8,h:.1},cal:false};
if(!(await DB.get('meta','seeded'))){const C=['#253B80','#F07B64','#D5EF77'],T=['#fff','#fff','#253B80'];
['Aria Rahman','Bilal Hasan','Chowdhury Nila','Dipto Sarker','Eshita Karim','Farhan Islam','Gulshan Ara','Hasib Mia','Ishrat Jahan','Jubayer Ahmed','Kamrul Hossain','Labonno Das','Mahin Khan','Nusrat Sultana'].forEach((n,i)=>{const ini=n.split(' ').map(x=>x[0]).join('');
DB.put('recruits',{id:uid(),name:'Sample '+n,sample:true,active:true,created:Date.now(),portrait:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 400'><rect fill='${C[i%3]}' width='320' height='400'/><circle cx='160' cy='150' r='62' fill='#fff' opacity='.85'/><path d='M50 400a110 120 0 0 1 220 0z' fill='#fff' opacity='.85'/><text x='160' y='170' text-anchor='middle' font-size='54' font-family='sans-serif' font-weight='800' fill='${T[i%3]}'>${ini}</text></svg>`)})});
await DB.put('meta',{id:'seeded'})}
route()}
addEventListener('hashchange',route);
function route(){clearInterval(iv);const r=location.hash.slice(2);({play,board,admin}[r]||home)()}
// ===== HOME =====
async function home(){const n=(await DB.all('recruits')).filter(r=>r.active).length;
$('#m').innerHTML=`<h1>THE LEDGER<br><u>LEAGUE</u></h1><p style="font-size:22px;font-weight:600;margin:0 0 24px">Know your people.</p>
<p class=mu style="max-width:560px">Match ${N} recruit photos to their names. Drag a photo onto a name, or tap a photo and then a name. Fewer misses means more points: 100 first try, then 60, 30, 10.</p>
<p class=mu style="max-width:560px">Bonuses: +${CFG.COMBO_B} for every ${CFG.COMBO} matches in a row, +${CFG.PERF} for a flawless round, and up to +${CFG.SPEED.max} for speed (timer on).</p>
<div class=row><input type=text id=nm placeholder="Display name" maxlength=24 value="${esc(S.name)}" aria-label="Display name"></div>
<div class=row><label><input type=checkbox id=tm ${S.timer?'checked':''}> Timer and speed bonus</label><label><input type=checkbox id=sn ${S.sound?'checked':''}> Sound</label></div>
<div class=row>${n>=N?'<button class=btn data-a=start>Start game</button>':`<div><b>Not enough recruits yet.</b><br><span class=mu>${n} active, ${N} needed. Add recruits in <a href="#/admin">Admin</a>.</span></div>`}<a class="btn s" href="#/board" style="text-decoration:none">View leaderboard</a></div>`}
// ===== GAME =====
async function start(){const rs=(await DB.all('recruits')).filter(r=>r.active);if(rs.length<N)return toast('Need at least '+N+' active recruits');
const pick=shuf(rs).slice(0,N);G={id:uid(),names:shuf(pick),photos:shuf(pick),log:[],sel:null,flash:null,t0:performance.now(),timer:S.timer,done:false};location.hash='#/play';if(location.hash=='#/play')route()}
function play(){if(!G||G.done)return start();draw();iv=setInterval(()=>{const e=$('#tm');if(e)e.textContent=fmt((performance.now()-G.t0)/1e3)},250)}
function draw(){const c=calc(G.log,0,0),ok=new Set(G.log.filter(e=>e.ok).map(e=>e.r));
$('#m').innerHTML=`<div class=bar><div><b>Score</b><span>${c.total}</span></div><div><b>Matched</b><span>${c.m}/${N}</span></div><div><b>Streak</b><span>${c.st}</span></div>${G.timer?'<div><b>Time</b><span id=tm>0:00</span></div>':''}</div>
<p class=hint>${G.sel?'Now tap a name.':'Drag a photo onto a name, or tap a photo, then a name.'} Next combo bonus in ${CFG.COMBO-c.st%CFG.COMBO} ${G.timer?'· Speed bonus active':''}</p>
<div class=g><div class=sls>${G.names.map(r=>{const d=ok.has(r.id),f=G.flash&&G.flash.sid==r.id;return`<button class="sl ${d?'ok':''} ${f?'bad':''}" data-a=slot data-id="${r.id}">${d?`<img class=ph src="${r.portrait}" alt="">`:f?`<img class="ph ghost" src="${G.flash.img}" alt="">`:'<span class=ph></span>'}<span class=nm>${esc(r.name)}</span>${d?'<i class=ck>✓</i>':''}</button>`}).join('')}</div>
<div class=pool>${G.photos.filter(r=>!ok.has(r.id)).map(r=>`<button class="pc ${G.sel==r.id?'sel':''}" draggable=true data-a=pic data-id="${r.id}" aria-label="Recruit photo"><img src="${r.portrait}" alt="" loading=lazy draggable=false></button>`).join('')}</div></div>
<div class=row><button class="btn s" data-a=restart>Restart round</button></div>`}
function attempt(rid,sid){if(!G||G.done||G.log.some(e=>e.ok&&(e.r==rid||e.s==sid)))return;const b=calc(G.log,0,0),ok=rid==sid;
G.log.push({r:rid,s:sid,ok,t:Math.round(performance.now()-G.t0)});G.sel=null;const a=calc(G.log,0,0);
if(ok){beep(660);beep(880,.15);let msg='+'+(a.base-b.base);if(a.combo>b.combo)msg+=' · Combo +'+CFG.COMBO_B;toast(msg);G.flash=null}else{beep(180,.2);G.flash={sid,img:G.photos.find(p=>p.id==rid).portrait}}
draw();if(!ok)setTimeout(()=>{G.flash=null;if(location.hash=='#/play'&&!G.done)draw()},550);
if(a.done){G.done=true;G.secs=(performance.now()-G.t0)/1e3;setTimeout(victory,700)}}
// ===== VICTORY =====
function victory(){clearInterval(iv);const c=calc(G.log,G.secs,G.timer);G.c=c;
const ach=[[c.first==N,'Perfect Match','10 first-try matches'],[G.secs<=CFG.QUICK,'Quick Fingers','Finished within '+CFG.QUICK+'s'],[c.mx>=5,'On a Roll','5 in a row'],[c.perfect>0,'Eagle Eye','Flawless round']].filter(a=>a[0]);
$('#m').innerHTML=`<p class=mu>Round complete · ${rankOf(c.total)}</p><div class=big id=big>0</div>
<p>${fmt(G.secs)} · ${c.first}/${N} first try · best streak ${c.mx}</p>
<table style="max-width:420px"><tr><td>Matches</td><td class=n>${c.base}</td></tr><tr><td>Combo bonus</td><td class=n>+${c.combo}</td></tr><tr><td>Perfect round</td><td class=n>+${c.perfect}</td></tr><tr><td>Speed bonus${G.timer?'':' (timer off)'}</td><td class=n>+${c.speed}</td></tr><tr><th>Total</th><th class=n>${c.total}</th></tr></table>
<div style="margin:16px 0">${ach.map(a=>`<span class="tg ach" title="${a[2]}">★ ${a[1]}</span>`).join('')||'<span class=mu>No achievements this time.</span>'}</div>
<div class=row><input type=text id=pn placeholder="Display name" maxlength=24 value="${esc(S.name)}"><button class=btn data-a=submit id=sb>Submit score</button><button class="btn s" data-a=start>Play again</button><a class="btn s" href="#/board" style="text-decoration:none">View leaderboard</a></div>`;
let t0=performance.now();(function f(t){const k=clamp((t-t0)/1200,0,1);$('#big').textContent=Math.round(c.total*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0);
if(c.total>=800||c.perfect)for(let i=0;i<50;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${['#F07B64','#D5EF77','#253B80'][i%3]};animation-delay:${Math.random()*.6}s`;document.body.append(e);setTimeout(()=>e.remove(),3400)}}
async function submit(){const name=$('#pn').value.trim().slice(0,24);if(!name)return toast('Enter a display name');
const c=calc(G.log,G.secs,G.timer);if(!c.done||c.total!=G.c.total)return toast('Score failed validation');if(await DB.get('results',G.id))return toast('This round was already submitted');
S.name=name;S.pid=S.pid||uid();await DB.put('meta',{id:'player',pid:S.pid,name});
await DB.put('results',{id:G.id,pid:S.pid,name,score:c.total,first:c.first,wrong:c.wrong,secs:G.secs,streak:c.mx,bonus:{combo:c.combo,perfect:c.perfect,speed:c.speed},date:Date.now(),log:G.log});$('#sb').disabled=true;toast('Score submitted');location.hash='#/board'}
// ===== LEADERBOARD =====
let bq='';async function board(){const rs=await DB.all('results'),P={};
for(const r of rs){const p=P[r.pid]||(P[r.pid]={pid:r.pid,name:r.name,best:0,games:0,secs:1e9,streak:0});p.games++;p.name=r.name;p.best=Math.max(p.best,r.score);p.secs=Math.min(p.secs,r.secs);p.streak=Math.max(p.streak,r.streak)}
const L=Object.values(P).sort((a,b)=>b.best-a.best||a.secs-b.secs),top=L.slice(0,3),q=bq.toLowerCase(),rest=L.slice(3).filter(p=>p.name.toLowerCase().includes(q));
const pd=(p,i)=>p?`<div class="p${i+1}"><span class=mu>#${i+1}</span><b>${p.best}</b>${esc(p.name)}<br><small class=mu>${fmt(p.secs)}</small></div>`:'<div></div>';
$('#m').innerHTML=`<h2>Leaderboard</h2><p class=mu>Ranked by highest single-round score. Stored in this browser only; connect a cloud backend to share it across players.</p>
${L.length?`<div class=pod>${pd(top[1],1)}${pd(top[0],0)}${pd(top[2],2)}</div><input type=search id=bs placeholder="Search player" value="${esc(bq)}" aria-label="Search player">
<table><tr><th>#</th><th>Player</th><th class=n>Best</th><th class=n>Games</th><th class=n>Best time</th><th class=n>Streak</th></tr>${rest.map(p=>`<tr class="${p.pid==S.pid?'me':''}"><td>${L.indexOf(p)+1}</td><td>${esc(p.name)}</td><td class=n>${p.best}</td><td class=n>${p.games}</td><td class=n>${fmt(p.secs)}</td><td class=n>${p.streak}</td></tr>`).join('')}</table>`:'<p><b>No scores yet.</b> <a href="#/">Play a round</a> and submit yours.</p>'}`;
$('#bs')?.addEventListener('input',e=>{bq=e.target.value;board().then(()=>{const i=$('#bs');i.focus();i.setSelectionRange(99,99)})})}
// ===== ADMIN =====
const hashPw=async(pw,salt)=>sha(new TextEncoder().encode(salt+pw));
async function admin(){const m=await DB.get('meta','admin');if(!A.auth){$('#m').innerHTML=`<h2>${m?'Admin sign in':'Create admin passcode'}</h2><p class=mu>${m?'':'First visit: choose a passcode (6+ characters). '}Local prototype: this gate runs in your browser and is not server-enforced security. See the Data tab for the Supabase setup that is.</p><div class=row><input type=password id=pw placeholder="Passcode" autocomplete=off><button class=btn data-a=${m?'login':'setpw'}>${m?'Sign in':'Create passcode'}</button></div>`;return}
A.staged=await DB.all('staged');const rs=await DB.all('recruits');
const T=[['rec','Recruits'],['imp','Import posters'],['dat','Data & setup']];
$('#m').innerHTML=`<div class=row style="justify-content:space-between"><h2 style="margin:0">Admin</h2><button class="btn s" data-a=logout>Sign out</button></div><div class=tab>${T.map(t=>`<button data-a=tab data-id=${t[0]} class="${A.tab==t[0]?'on':''}">${t[1]}${t[0]=='imp'&&A.staged.length?' ('+A.staged.length+')':''}</button>`).join('')}</div><div id=tabc></div>`;
({rec:()=>recTab(rs),imp:impTab,dat:()=>datTab(rs)})[A.tab]()}
function recTab(rs){const q=A.q.toLowerCase(),f=rs.filter(r=>r.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)),ac=rs.filter(r=>r.active).length;
$('#tabc').innerHTML=`<div class=st><div><b>${rs.length}</b>total</div><div><b>${ac}</b>active</div><div><b>${rs.length-ac}</b>inactive</div></div><div class=row><input type=search id=rq placeholder="Search recruits" value="${esc(A.q)}">${rs.some(r=>r.sample)?'<button class="btn c" data-a=rmsample>Remove sample data</button>':''}</div>
${f.length?f.map(r=>`<div class=rec><img class=ph src="${r.portrait}" loading=lazy alt=""><input type=text data-a=rn data-id="${r.id}" value="${esc(r.name)}" aria-label="Name">${r.sample?'<span class=tg>sample</span>':'<span></span>'}<span class=row style="margin:0"><label><input type=checkbox data-a=act data-id="${r.id}" ${r.active?'checked':''}> Active</label><button class="btn s" data-a=del data-id="${r.id}">Delete</button></span></div>`).join(''):'<p><b>No recruits.</b> Import posters in the Import tab.</p>'}`;
$('#rq').addEventListener('input',e=>{A.q=e.target.value;recTab(rs);const i=$('#rq');i.focus();i.setSelectionRange(99,99)})}
// --- import ---
const pr=(b,p)=>({x:p.x,y:p.y,w:p.w,h:p.w*b.width*1.25/b.height});
function cv(b,r,W,H){const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(b,r.x*b.width,r.y*b.height,r.w*b.width,r.h*b.height,0,0,W,H);return c}
async function mk(it){const b=await createImageBitmap(it.blob),t=it.crop||A.tpl;it.portrait=cv(b,pr(b,t.p),320,400).toDataURL('image/jpeg',.82);
it.strip=cv(b,t.n,480,Math.max(24,Math.round(480*t.n.h*b.height/(t.n.w*b.width)))).toDataURL('image/jpeg',.7);b.close()}
const guess=n=>n.replace(/\.[^.]+$/,'').replace(/[_\-.]+/g,' ').replace(/\d+/g,'').trim().replace(/\b\w/g,c=>c.toUpperCase());
const mime=n=>/png$/i.test(n)?'image/png':/webp$/i.test(n)?'image/webp':'image/jpeg';
async function ingest(files){for(const f of files){if(/\.zip$/i.test(f.name)){try{const z=await JSZip.loadAsync(f);for(const [n,e] of Object.entries(z.files)){if(e.dir||/__MACOSX|(^|\/)\./.test(n)||!/\.(jpe?g|png|webp)$/i.test(n))continue;A.Q.push({name:n.split('/').pop(),size:e._data?.uncompressedSize||0,get:async()=>new Blob([await e.async('arraybuffer')],{type:mime(n)}),st:'pending'})}}catch(x){A.Q.push({name:f.name,st:'fail',err:'Unreadable ZIP'})}}
else if(/^image\//.test(f.type))A.Q.push({name:f.name,size:f.size,get:async()=>f,st:'pending'});else A.Q.push({name:f.name,st:'fail',err:'Not an image or ZIP'})}
runQ()}
async function proc(it){try{const b=await it.get();if(b.size>CFG.MAXFILE)throw Error('Over '+CFG.MAXFILE/1e6+' MB');const h=await sha(await b.arrayBuffer());
if(A.seen.has(h)||await DB.get('posters',h)||await DB.get('staged',h)){it.st='skip';return}A.seen.add(h);
const s={id:h,file:it.name,blob:b,name:guess(it.name),crop:null};await mk(s);await DB.put('staged',s);it.st='done'}catch(e){it.st='fail';it.err=e.message||'Could not read image'}}
async function runQ(){if(A.run)return;A.run=true;let p;while((p=A.Q.filter(x=>x.st=='pending').slice(0,CFG.BATCH)).length){p.forEach(x=>x.st='run');await Promise.all(p.map(proc));paintImp()}A.run=false;if(A.tab=='imp')admin()}
const cnt=s=>A.Q.filter(x=>x.st==s).length;
function paintImp(){const e=$('#prog');if(!e)return;const t=A.Q.length,d=t-cnt('pending')-cnt('run');e.innerHTML=t?`<div class=pg><i style="width:${t?d/t*100:0}%"></i></div><p>${d}/${t} processed · ${cnt('fail')} failed · ${cnt('skip')} duplicates skipped ${cnt('fail')&&!A.run?'<button class="btn s" data-a=retry>Retry failed</button>':''}</p>${A.Q.filter(x=>x.st=='fail').map(x=>`<p class=mu>${esc(x.name)}: ${esc(x.err)}</p>`).join('')}`:''}
function impTab(){const S2=A.staged,names={};S2.forEach(s=>{const k=s.name.trim().toLowerCase();names[k]=(names[k]||0)+1});
$('#tabc').innerHTML=`${A.tpl.cal?'':'<p class=tg style="background:var(--er)">Template not calibrated. Open a staged poster and click Calibrate before approving.</p>'}
<div class=drop id=dz><p><b>Drop a ZIP of posters or image files here</b></p><p class=mu>Processed locally in ${CFG.BATCH}s. Nothing is stored until you approve.</p><input type=file id=fi multiple accept=".zip,image/*"></div><div id=prog style="margin:12px 0"></div><div id=edh></div>
${S2.length?`<div class=row><button class=btn data-a=apprsel>Approve selected (${A.sel.size})</button><button class="btn l" data-a=apprall>Approve all</button><button class="btn s" data-a=selall>Select all</button><button class="btn s" data-a=calib>Calibrate template</button><button class="btn s" data-a=discard>Discard selected</button></div>
<div class=rv>${S2.map(s=>{const dup=names[s.name.trim().toLowerCase()]>1;return`<div><label><input type=checkbox data-a=sel data-id="${s.id}" ${A.sel.has(s.id)?'checked':''}> ${esc(s.file)}</label><div class=row style="margin:0;align-items:flex-start"><img class=pi src="${s.portrait}" alt=""><img src="${s.strip}" alt="Name region" style="flex:1;min-width:0;object-fit:contain"></div><input type=text data-a=sn data-id="${s.id}" value="${esc(s.name)}" aria-label="Recruit name">${dup||s.dupName?'<span class="tg w">Possible duplicate name</span>':''}<button class="btn s" data-a=crop data-id="${s.id}">Adjust crop</button></div>`}).join('')}</div>`:'<p class=mu>Review queue is empty. Imported posters wait here until you approve them.</p>'}`;
const fi=$('#fi');fi.onchange=()=>{ingest(fi.files);fi.value=''};const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('dr')};dz.ondragleave=()=>dz.classList.remove('dr');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dr');ingest(e.dataTransfer.files)};paintImp();edPaint()}
function edPaint(){const h=$('#edh');if(!h||!A.E)return;const t=A.E.t,sl=(k,l,a,b)=>{const[x,y]=k.split('.');return`<label>${l}<input type=range data-a=rg data-k=${k} min=${a} max=${b} step=.005 value=${t[x][y]}></label>`};
h.innerHTML=`<div class=ed><div><canvas id=ec></canvas></div><div class=edp><canvas id=ep width=120 height=150></canvas><p class=mu style="margin:0">Lime: portrait. Coral: name region.</p>${sl('p.x','Portrait X',0,1)}${sl('p.y','Portrait Y',0,1)}${sl('p.w','Portrait size',.05,1)}${sl('n.x','Name X',0,1)}${sl('n.y','Name Y',0,1)}${sl('n.w','Name width',.05,1)}${sl('n.h','Name height',.02,.5)}<button class=btn data-a=savetpl>Save template, apply to all</button><button class="btn s" data-a=saveone>This poster only</button><button class="btn s" data-a=closeEd>Close</button></div></div>`;edDraw()}
function edDraw(){const E=A.E,b=E.b,c=$('#ec');c.width=560;c.height=Math.round(560*b.height/b.width);const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);
const p=pr(b,E.t.p),n=E.t.n;x.lineWidth=4;x.strokeStyle='#D5EF77';x.strokeRect(p.x*560,p.y*c.height,p.w*560,p.h*c.height);x.strokeStyle='#F07B64';x.strokeRect(n.x*560,n.y*c.height,n.w*560,n.h*c.height);
$('#ep').getContext('2d').drawImage(cv(b,p,320,400),0,0,120,150)}
async function openEd(id){const s=A.staged.find(x=>x.id==id);if(!s)return;A.E={id,t:structuredClone(s.crop||A.tpl),b:await createImageBitmap(s.blob)};edPaint();$('#edh').scrollIntoView({behavior:'smooth'})}
async function approve(ids){let n=0;for(const s of A.staged.filter(x=>ids.includes(x.id))){const nm=s.name.trim();if(!nm)continue;await DB.put('posters',{id:s.id,blob:s.blob,file:s.file});
await DB.put('recruits',{id:uid(),name:nm,portrait:s.portrait,posterId:s.id,active:true,created:Date.now()});await DB.del('staged',s.id);A.sel.delete(s.id);n++}toast(n+' recruits added');admin()}
// --- data tab ---
async function datTab(rs){const e=navigator.storage?.estimate?await navigator.storage.estimate():null;
$('#tabc').innerHTML=`<h3>Backup and restore</h3><div class=row><button class=btn data-a=bk>Export backup (portraits + scores)</button><button class="btn s" data-a=bkp>Export with original posters</button><label class="btn s">Restore backup<input type=file id=rf accept=".json" hidden></label></div>
<h3>Limits and storage</h3><p class=mu style="max-width:640px">This build stores everything in your browser's IndexedDB: ${e?`about ${(e.usage/1e6).toFixed(1)} MB used of roughly ${(e.quota/1e6).toFixed(0)} MB available (varies by browser and device; Safari is the strictest)`:'quota unknown'}. Data is per browser and per device, and clearing site data erases it, so export backups.</p>
<ul class=mu style="max-width:640px"><li>Per-poster limit: ${CFG.MAXFILE/1e6} MB (change CFG.MAXFILE). No limit on poster count; 100 posters at 2 to 5 MB is 200 to 500 MB of storage plus about 30 KB per portrait.</li><li>Portraits are resized to 320×400 JPEG. Each original poster is stored once, keyed by content hash, so duplicate uploads are ignored.</li><li>A ZIP is read in your browser and posters are decoded one batch at a time. Very large ZIPs (over about 1 GB) may exhaust phone memory; split them.</li><li>No OCR in this build: names come from file names and you type corrections. Images never leave your device.</li></ul>
<h3>Going cloud (shared leaderboard, real admin security)</h3><p class=mu style="max-width:640px">Replace the DB object with Supabase calls: tables recruits, players, results; Storage buckets posters (private) and portraits (public); Auth for the admin account with row-level security so only the admin role can write recruits and only a server function inserts results. Free-tier storage is about 1 GB with a per-file cap (check current Supabase limits), so 100 large posters may need a paid plan. Not connected in this prototype.</p>`;
$('#rf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());const ex=new Set((await DB.all('recruits')).map(r=>r.id));let n=0;
for(const r of j.recruits||[])if(!ex.has(r.id)){await DB.put('recruits',r);n++}for(const p of j.posters||[])await DB.put('posters',{id:p.id,file:p.file,blob:await (await fetch(p.data)).blob()});for(const r of j.results||[])await DB.put('results',r);toast(n+' recruits restored')}catch(x){toast('Invalid backup file')}admin()}}
async function backup(withP){const du=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const o={v:1,recruits:await DB.all('recruits'),results:await DB.all('results')};if(withP){o.posters=[];for(const p of await DB.all('posters'))o.posters.push({id:p.id,file:p.file,data:await du(p.blob)})}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
// ===== EVENTS =====
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(a=='start')start();else if(a=='pic'){G.sel=G.sel==id?null:id;draw()}else if(a=='slot'){if(G.sel)attempt(G.sel,id);else toast('Pick a photo first')}
else if(a=='restart'){if(confirm('Restart this round? Your progress will be lost.')){G=null;start()}}else if(a=='submit')submit();
else if(a=='setpw'){const p=$('#pw').value;if(p.length<6)return toast('Use 6+ characters');const salt=uid();await DB.put('meta',{id:'admin',salt,hash:await hashPw(p,salt)});A.auth=true;admin()}
else if(a=='login'){const m=await DB.get('meta','admin');if(await hashPw($('#pw').value,m.salt)==m.hash){A.auth=true;admin()}else toast('Wrong passcode')}else if(a=='logout'){A.auth=false;admin()}
else if(a=='tab'){A.tab=id;A.E=null;admin()}else if(a=='del'){if(confirm('Delete this recruit permanently?')){await DB.del('recruits',id);admin()}}
else if(a=='rmsample'){if(confirm('Remove all sample recruits?')){for(const r of await DB.all('recruits'))if(r.sample)await DB.del('recruits',r.id);admin()}}
else if(a=='retry'){A.Q.filter(x=>x.st=='fail'&&x.get).forEach(x=>x.st='pending');runQ()}else if(a=='sel'){t.checked?A.sel.add(id):A.sel.delete(id);impTab()}
else if(a=='selall'){A.staged.forEach(s=>A.sel.add(s.id));impTab()}else if(a=='apprsel')approve([...A.sel]);else if(a=='apprall'){if(!A.tpl.cal&&!confirm('Template is not calibrated. Approve anyway?'))return;approve(A.staged.map(s=>s.id))}
else if(a=='discard'){if(A.sel.size&&confirm('Discard '+A.sel.size+' staged posters?')){for(const i of A.sel)await DB.del('staged',i);A.sel.clear();admin()}}
else if(a=='crop')openEd(id);else if(a=='calib'){if(A.staged[0])openEd(A.staged[0].id)}else if(a=='closeEd'){A.E=null;$('#edh').innerHTML=''}
else if(a=='saveone'){const s=A.staged.find(x=>x.id==A.E.id);s.crop=structuredClone(A.E.t);await mk(s);await DB.put('staged',s);A.E=null;admin()}
else if(a=='savetpl'){A.tpl={id:'template',...structuredClone(A.E.t),cal:true};await DB.put('meta',A.tpl);toast('Applying template…');for(const s of A.staged)if(!s.crop){await mk(s);await DB.put('staged',s)}A.E=null;admin()}
else if(a=='bk')backup(0);else if(a=='bkp'){if(confirm('Posters can make this file very large. Continue?'))backup(1)}});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id;
if(t.id=='tm')S.timer=t.checked;else if(t.id=='sn')S.sound=t.checked;else if(t.id=='nm')S.name=t.value.trim();
else if(a=='act'){const r=await DB.get('recruits',id);r.active=t.checked;await DB.put('recruits',r);admin()}
else if(a=='rn'){const r=await DB.get('recruits',id),v=t.value.trim();if(!v)return admin();r.name=v;await DB.put('recruits',r);toast('Name saved')}
else if(a=='sn'){const s=A.staged.find(x=>x.id==id);s.name=t.value;await DB.put('staged',s);impTab()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a=='rg'){const[a,b]=t.dataset.k.split('.');A.E.t[a][b]=+t.value;edDraw()}});
document.addEventListener('dragstart',e=>{const p=e.target.closest('[data-a=pic]');if(p){G.sel=null;G.drag=p.dataset.id;e.dataTransfer.setData('text/plain',G.drag)}});
document.addEventListener('dragover',e=>{const s=e.target.closest('[data-a=slot]');if(s&&G?.drag){e.preventDefault();s.classList.add('dr')}});
document.addEventListener('dragleave',e=>e.target.closest?.('[data-a=slot]')?.classList.remove('dr'));
document.addEventListener('drop',e=>{const s=e.target.closest('[data-a=slot]');if(s&&G?.drag){e.preventDefault();const r=G.drag;G.drag=null;attempt(r,s.dataset.id)}});
init();
</script></body></html>
