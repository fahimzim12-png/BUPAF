<script>

const N=10,CFG={PTS:[100,60,30,10],COMBO:3,COMBO_B:30,PERF:300,SPEED:{max:100,full:60,zero:240},QUICK:90,BATCH:5,OCR_MIN:60,MAXFILE:15e6,
RANKS:[[0,'Stranger'],[400,'Acquaintance'],[800,'Forum Insider'],[1100,'Recruit Master'],[1350,'Accounting Forum Legend']]}; // max possible = 1000+90+300+100 = 1490
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sha=async b=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('');
let tt;const toast=t=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);clearTimeout(tt);tt=setTimeout(()=>e.remove(),2200)};
// ===== STORAGE LAYER (IndexedDB, local to this browser). Swap this object for Supabase calls to go cloud. =====

async function proc(it){try{const b=await it.get();if(b.size>CFG.MAXFILE)throw Error('Over '+CFG.MAXFILE/1e6+' MB');const h=await sha(await b.arrayBuffer());
if(A.seen.has(h)||await DB.get('posters',h)||await DB.get('staged',h)){it.st='skip';return}A.seen.add(h);
const s={id:h,file:it.name,blob:b,name:'',crop:null};await mk(s);await ocrItem(s);await DB.put('staged',s);it.st='done'}catch(e){it.st='fail';it.err=e.message||'Could not read image'}}
async function runQ(){if(A.run)return;A.run=true;let p;while((p=A.Q.filter(x=>x.st=='pending').slice(0,CFG.BATCH)).length){p.forEach(x=>x.st='run');await Promise.all(p.map(proc));paintImp()}A.run=false;if(A.tab=='imp')admin()}
const cnt=s=>A.Q.filter(x=>x.st==s).length;
function paintImp(){const e=$('#prog');if(!e)return;const t=A.Q.length,d=t-cnt('pending')-cnt('run');e.innerHTML=t?`<div class=pg><i style="width:${t?d/t*100:0}%"></i></div><p>${d}/${t} processed · ${cnt('fail')} failed · ${cnt('skip')} duplicates skipped ${cnt('fail')&&!A.run?'<button class="btn s" data-a=retry>Retry failed</button>':''}</p>${A.Q.filter(x=>x.st=='fail').map(x=>`<p class=mu>${esc(x.name)}: ${esc(x.err)}</p>`).join('')}`:''}
function impTab(){const S2=A.staged,names={};S2.forEach(s=>{const k=s.name.trim().toLowerCase();names[k]=(names[k]||0)+1});
$('#tabc').innerHTML=`${A.tpl.cal?'':'<p class=tg style="background:var(--er)">Template not calibrated. Open a staged poster and click Calibrate before approving.</p>'}
${A.ocrErr?'<p class="tg w">'+esc(A.ocrErr)+'. Type names manually.</p>':''}<div class=drop id=dz><p><b>Drop a ZIP of posters or image files here</b></p><p class=mu>Processed locally in ${CFG.BATCH}s. Nothing is stored until you approve.</p><input type=file id=fi multiple accept=".zip,image/*"></div><div id=prog style="margin:12px 0"></div><div id=edh></div>
${S2.length?`<div class=row><button class=btn data-a=apprsel>Approve selected (${A.sel.size})</button><button class="btn l" data-a=apprall>Approve all</button><button class="btn s" data-a=selall>Select all</button><button class="btn s" data-a=calib>Calibrate template</button><button class="btn s" data-a=discard>Discard selected</button></div>
<div class=rv>${S2.map(s=>{const k=s.name.trim().toLowerCase(),dup=k&&(names[k]>1||A.rn?.has(k));return`<div><label><input type=checkbox data-a=sel data-id="${s.id}" ${A.sel.has(s.id)?'checked':''}> ${esc(s.file)}</label><div class=row style="margin:0;align-items:flex-start"><img class=pi src="${s.portrait}" alt=""><img src="${s.strip}" alt="Name region" style="flex:1;min-width:0;object-fit:contain"></div><input type=text data-a=sn data-id="${s.id}" value="${esc(s.name)}" placeholder="Type the name" aria-label="Recruit name">${nst(s)}${dup?'<span class="tg w">Possible duplicate name</span>':''}<span class=row style="margin:0"><button class="btn s" data-a=conf data-id="${s.id}">Name is correct</button><button class="btn s" data-a=reocr data-id="${s.id}">Re-read</button><button class="btn s" data-a=crop data-id="${s.id}">Adjust crop</button></span></div>`}).join('')}</div>`:'<p class=mu>Review queue is empty. Imported posters wait here until you approve them. Duplicate files are detected by content hash; after a library wipe, you can upload the same posters again.</p>'}`;
const fi=$('#fi');fi.onchange=()=>{ingest(fi.files);fi.value=''};const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('dr')};dz.ondragleave=()=>dz.classList.remove('dr');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dr');ingest(e.dataTransfer.files)};paintImp();edPaint()}
function edPaint(){const h=$('#edh');if(!h||!A.E)return;const t=A.E.t,sl=(k,l,a,b)=>{const[x,y]=k.split('.');return`<label>${l}<input type=range data-a=rg data-k=${k} min=${a} max=${b} step=.005 value=${t[x][y]}></label>`};
h.innerHTML=`<div class=ed><div><canvas id=ec></canvas></div><div class=edp><canvas id=ep width=120 height=150></canvas><p class=mu style="margin:0">Lime: portrait. Coral: name region.</p>${sl('p.x','Portrait X',0,1)}${sl('p.y','Portrait Y',0,1)}${sl('p.w','Portrait size',.05,1)}${sl('n.x','Name X',0,1)}${sl('n.y','Name Y',0,1)}${sl('n.w','Name width',.05,1)}${sl('n.h','Name height',.02,.5)}<button class=btn data-a=savetpl>${E.recMode?'Save template & re-crop all recruits':'Save template, apply to all'}</button>${E.recMode?'':'<button class="btn s" data-a=saveone>This poster only</button>'}<button class="btn s" data-a=closeEd>Close</button></div></div>`;edDraw()}
function edDraw(){const E=A.E,b=E.b,c=$('#ec');c.width=560;c.height=Math.round(560*b.height/b.width);const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);
const p=pr(b,E.t.p),n=E.t.n;x.lineWidth=4;x.strokeStyle='#D5EF77';x.strokeRect(p.x*560,p.y*c.height,p.w*560,p.h*c.height);x.strokeStyle='#F07B64';x.strokeRect(n.x*560,n.y*c.height,n.w*560,n.h*c.height);
$('#ep').getContext('2d').drawImage(cv(b,p,320,400),0,0,120,150)}
async function openEd(id){const s=A.staged.find(x=>x.id==id);if(!s)return;A.E={id,t:structuredClone(s.crop||A.tpl),b:await createImageBitmap(s.blob)};edPaint();$('#edh').scrollIntoView({behavior:'smooth'})}
async function openExistingEd(){const rs=(await DB.all('recruits')).filter(r=>!r.sample&&r.posterId);if(!rs.length)return toast('No imported poster available to calibrate');const r=rs[0],p=await DB.get('posters',r.posterId);if(!p?.blob)return toast('Original poster not found for this recruit');A.E={id:r.id,t:structuredClone(A.tpl),b:await createImageBitmap(p.blob),recMode:true};edPaint();$('#edh').scrollIntoView({behavior:'smooth'})}
async function clearLibrary(){if(!confirm('Delete ALL recruits, original posters, and staged imports? Scores and player settings will be preserved. This cannot be undone.'))return;for(const store of ['recruits','posters','staged'])await DB.clear(store);A.staged=[];A.sel.clear();A.seen.clear();A.Q=[];A.E=null;toast('Recruit and poster library cleared. Ready for a clean upload.');admin()}

async function approve(ids){let n=0,sk=0;for(const s of A.staged.filter(x=>ids.includes(x.id))){const nm=s.name.trim();if(!nm||!(s.ok||(s.ocr&&s.ocr.conf>=CFG.OCR_MIN))){sk++;continue}
await DB.put('posters',{id:s.id,blob:s.blob,file:s.file});
await DB.put('recruits',{id:uid(),name:nm,portrait:s.portrait,posterId:s.id,active:true,created:Date.now(),nameSrc:s.ok?'manual':'ocr',nameConf:s.ocr?s.ocr.conf:null,ocrName:s.ocr?s.ocr.text:'',verified:!!s.ok,needsReview:false,ocrDone:true,nreg:s.crop?s.crop.n:null});await DB.del('staged',s.id);A.sel.delete(s.id);n++}
toast(n+' recruits added'+(sk?'. '+sk+' still need a name check':''));admin()}
// --- data tab ---
async function datTab(rs){const e=navigator.storage?.estimate?await navigator.storage.estimate():null;
$('#tabc').innerHTML=`<h3>Backup and restore</h3><div class=row><button class=btn data-a=bk>Export backup (portraits + scores)</button><button class="btn s" data-a=bkp>Export with original posters</button><label class="btn s">Restore backup<input type=file id=rf accept=".json" hidden></label></div>
<h3>Limits and storage</h3><p class=mu style="max-width:640px">This build stores everything in your browser's IndexedDB: ${e?`about ${(e.usage/1e6).toFixed(1)} MB used of roughly ${(e.quota/1e6).toFixed(0)} MB available (varies by browser and device; Safari is the strictest)`:'quota unknown'}. Data is per browser and per device, and clearing site data erases it, so export backups.</p>
<ul class=mu style="max-width:640px"><li>Per-poster limit: ${CFG.MAXFILE/1e6} MB (change CFG.MAXFILE). No limit on poster count; 100 posters at 2 to 5 MB is 200 to 500 MB of storage plus about 30 KB per portrait.</li><li>Portraits are resized to 320×400 JPEG. Each original poster is stored once, keyed by content hash, so duplicate uploads are ignored.</li><li>A ZIP is read in your browser and posters are decoded one batch at a time. Very large ZIPs (over about 1 GB) may exhaust phone memory; split them.</li><li>Names are read in your browser with Tesseract.js OCR (no API key). The engine and English language data download once from a public CDN; poster images are never uploaded. OCR can be wrong, so results under ${CFG.OCR_MIN}% confidence need your confirmation before they enter the game.</li></ul>
<h3>Danger zone</h3><p class=mu>Clear the recruit/poster library and staged imports. Scores and leaderboard entries are preserved.</p><div class=row><button class=btn c data-a=clearall>Delete all recruits, posters &amp; imports</button></div><h3>Going cloud (shared leaderboard, real admin security)</h3><p class=mu style="max-width:640px">Replace the DB object with Supabase calls: tables recruits, players, results; Storage buckets posters (private) and portraits (public); Auth for the admin account with row-level security so only the admin role can write recruits and only a server function inserts results. Free-tier storage is about 1 GB with a per-file cap (check current Supabase limits), so 100 large posters may need a paid plan. Not connected in this prototype.</p>`;
$('#rf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());const ex=new Set((await DB.all('recruits')).map(r=>r.id));let n=0;
for(const r of j.recruits||[])if(!ex.has(r.id)){await DB.put('recruits',r);n++}for(const p of j.posters||[])await DB.put('posters',{id:p.id,file:p.file,blob:await (await fetch(p.data)).blob()});for(const r of j.results||[])await DB.put('results',r);toast(n+' recruits restored')}catch(x){toast('Invalid backup file')}admin()}}
async function backup(withP){const du=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const o={v:1,recruits:await DB.all('recruits'),results:await DB.all('results')};if(withP){o.posters=[];for(const p of await DB.all('posters'))o.posters.push({id:p.id,file:p.file,data:await du(p.blob)})}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
// ===== EVENTS =====
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(a=='start')start();else if(a=='pic'){G.sel=G.sel==id?null:id;draw()}else if(a=='slot'){if(G.sel)attempt(G.sel,id);else toast('Pick a photo first')}
else if(a=='restart'){if(confirm('Restart this round? Your progress will be lost.')){G=null;start()}}else if(a=='submit')submit();
else if(a=='setpw'){const p=$('#pw').value;if(p.length<6)return toast('Use 6+ characters');const salt=uid();await DB.put('meta',{id:'admin',salt,hash:await hashPw(p,salt)});A.auth=true;admin()}
else if(a=='login'){const m=await DB.get('meta','admin');if(await hashPw($('#pw').value,m.salt)==m.hash){A.auth=true;admin()}else toast('Wrong passcode')}else if(a=='logout'){A.auth=false;admin()}
else if(a=='tab'){A.tab=id;A.E=null;admin()}else if(a=='del'){if(confirm('Delete this recruit permanently?')){const r=await DB.get('recruits',id);await DB.del('recruits',id);if(r?.posterId&&!((await DB.all('recruits')).some(x=>x.posterId===r.posterId)))await DB.del('posters',r.posterId);admin()}}
else if(a=='rmsample'){if(confirm('Remove all sample recruits?')){for(const r of await DB.all('recruits'))if(r.sample)await DB.del('recruits',r.id);admin()}}else if(a=='clearall')clearLibrary();else if(a=='editExistingTpl')openExistingEd();
else if(a=='retry'){A.Q.filter(x=>x.st=='fail'&&x.get).forEach(x=>x.st='pending');runQ()}else if(a=='sel'){t.checked?A.sel.add(id):A.sel.delete(id);impTab()}
else if(a=='selall'){A.staged.forEach(s=>A.sel.add(s.id));impTab()}else if(a=='apprsel')approve([...A.sel]);else if(a=='apprall'){if(!A.tpl.cal&&!confirm('Template is not calibrated. Approve anyway?'))return;approve(A.staged.map(s=>s.id))}
else if(a=='discard'){if(A.sel.size&&confirm('Discard '+A.sel.size+' staged posters?')){for(const i of A.sel)await DB.del('staged',i);A.sel.clear();admin()}}
else if(a=='crop')openEd(id);else if(a=='calib'){if(A.staged[0])openEd(A.staged[0].id)}else if(a=='closeEd'){A.E=null;$('#edh').innerHTML=''}
else if(a=='saveone'){const s=A.staged.find(x=>x.id==A.E.id);s.crop=structuredClone(A.E.t);await mk(s);if(!s.ok)await ocrItem(s);await DB.put('staged',s);A.E=null;admin()}
else if(a=='savetpl'){const mode=!!A.E.recMode;A.tpl={id:'template',...structuredClone(A.E.t),cal:true};await DB.put('meta',A.tpl);toast(mode?'Applying new crop to existing recruits…':'Applying template and re-reading names…');for(const s of A.staged){s.crop=null;await mk(s);if(!s.ok)await ocrItem(s);await DB.put('staged',s)}if(mode){for(const r of await DB.all('recruits')){if(r.sample||!r.posterId)continue;const p=await DB.get('posters',r.posterId);if(!p?.blob)continue;const b=await createImageBitmap(p.blob);r.portrait=cv(b,pr(b,A.tpl.p),320,400).toDataURL('image/jpeg',.82);b.close();r.nreg=structuredClone(A.tpl.n);if(!r.verified){try{const o=await ocrBlob(p.blob,A.tpl.n);r.ocrName=o.text;r.nameConf=o.conf;r.ocrDone=true;if(o.text&&o.conf>=CFG.OCR_MIN){r.name=o.text;r.nameSrc='ocr';r.needsReview=false}else r.needsReview=true}catch(e){r.needsReview=true}}await DB.put('recruits',r)}}A.E=null;admin()}
else if(a=='conf'){const s=A.staged.find(x=>x.id==id);if(!s.name.trim())return toast('Type a name first');s.ok=true;await DB.put('staged',s);impTab()}
else if(a=='reocr'){const s=A.staged.find(x=>x.id==id);toast('Reading name…');s.ok=false;await ocrItem(s);await DB.put('staged',s);impTab()}
else if(a=='repair')repair();else if(a=='rerec')repair([id]);
else if(a=='confrec'){const r=await DB.get('recruits',id);if(!(r.name||'').trim())return toast('Type a name first');r.verified=true;r.needsReview=false;await DB.put('recruits',r);admin()}
else if(a=='pv'){const r=await DB.get('recruits',id),p=await DB.get('posters',r.posterId);if(!p)return toast('Original poster not found');const b=await createImageBitmap(p.blob),n=r.nreg||A.tpl.n,u=cv(b,n,480,Math.max(24,Math.round(480*n.h*b.height/(n.w*b.width)))).toDataURL('image/jpeg',.7);b.close();$('#pv-'+id).innerHTML=`<img src="${u}" alt="Name region" style="max-width:100%;border-radius:8px;margin-top:6px">`}
else if(a=='bk')backup(0);else if(a=='bkp'){if(confirm('Posters can make this file very large. Continue?'))backup(1)}});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id;
if(t.id=='tm')S.timer=t.checked;else if(t.id=='sn')S.sound=t.checked;else if(t.id=='nm')S.name=t.value.trim();else if(t.id=='nrf'){A.nr=t.checked;admin()}
else if(a=='act'){const r=await DB.get('recruits',id);r.active=t.checked;await DB.put('recruits',r);admin()}
else if(a=='rn'){const r=await DB.get('recruits',id),v=t.value.trim();if(!v)return admin();r.name=v;r.verified=true;r.needsReview=false;r.nameSrc='manual';await DB.put('recruits',r);toast('Name saved')}
else if(a=='sn'){const s=A.staged.find(x=>x.id==id);s.name=t.value;s.ok=!!t.value.trim();await DB.put('staged',s);impTab()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a=='rg'){const[a,b]=t.dataset.k.split('.');A.E.t[a][b]=+t.value;edDraw()}});
document.addEventListener('dragstart',e=>{const p=e.target.closest('[data-a=pic]');if(p){G.sel=null;G.drag=p.dataset.id;e.dataTransfer.setData('text/plain',G.drag)}});
document.addEventListener('dragover',e=>{const s=e.target.closest('[data-a=slot]');if(s&&G?.drag){e.preventDefault();s.classList.add('dr')}});
document.addEventListener('dragleave',e=>e.target.closest?.('[data-a=slot]')?.classList.remove('dr'));
document.addEventListener('drop',e=>{const s=e.target.closest('[data-a=slot]');if(s&&G?.drag){e.preventDefault();const r=G.drag;G.drag=null;attempt(r,s.dataset.id)}});
init();
</script></body></html>
